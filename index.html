<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4efe6" />
    <meta
      name="description"
      content="IDEA JAM is an AI idea generator for your next landing page, SaaS, game or web experiment. Roll, mix and publish."
    />
    <meta property="og:title" content="IDEA JAM — AI ideas for your next web project" />
    <meta
      property="og:description"
      content="A bold idea generator for web projects: format, niche, clear description and requirements written by AI in one click."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>IDEA JAM — AI ideas for your next web project</title>
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const files = [
          'core.min.js',
          'c/bitbug.min.js',
          'c/pip.min.js',
          'c/moss.min.js',
          'c/boing.min.js',
          'c/kitty.min.js',
          'c/mochi.min.js',
          'c/gloop.min.js',
          'c/dice.min.js',
          'c/star.min.js',
          'c/bolt.min.js',
          'c/heart.min.js',
          'c/marquee.min.js',
          'c/flap.min.js',
          'c/divider.min.js',
        ]
        const base = new URL('dist/', document.baseURI)
        for (const file of files) {
          const script = document.createElement('script')
          script.src = new URL(file, base).href
          script.async = false
          document.head.appendChild(script)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
