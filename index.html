<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ecebe6" />
    <meta
      name="description"
      content="IDEA JAM es un generador de tópicos random para tu próxima landing, SaaS, juego o experimento web. Tira, mezcla y publica."
    />
    <meta property="og:title" content="IDEA JAM — tópicos random para tu próxima web" />
    <meta
      property="og:description"
      content="Un generador neo-brutalista de ideas para proyectos web: formato, tema y brief generado con IA en un solo clic."
    />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>IDEA JAM — tópicos random para tu próxima web</title>
    <script>
      document.documentElement.classList.add('js')
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(() => {
        const files = [
          'core.min.js',
          'c/bitbug.min.js',
          'c/pip.min.js',
          'c/moss.min.js',
          'c/boing.min.js',
          'c/kitty.min.js',
          'c/mochi.min.js',
          'c/gloop.min.js',
          'c/dice.min.js',
          'c/star.min.js',
          'c/bolt.min.js',
          'c/heart.min.js',
          'c/marquee.min.js',
          'c/flap.min.js',
          'c/divider.min.js',
        ]
        const base = new URL('dist/', document.baseURI)
        for (const file of files) {
          const script = document.createElement('script')
          script.src = new URL(file, base).href
          script.async = false
          document.head.appendChild(script)
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
